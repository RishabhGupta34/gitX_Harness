pipeline:
  name: Expr Mongo Small Test
  identifier: expr_mongo_small
  projectIdentifier: ExpressionUsage
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: s
        identifier: s
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: p1
                  identifier: p1
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: export v="one"
                    environmentVariables: []
                    outputVariables:
                      - name: v
                        type: String
                        value: v
                  timeout: 10m
              - step:
                  type: ShellScript
                  name: p2
                  identifier: p2
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: export v="two"
                    environmentVariables: []
                    outputVariables:
                      - name: v
                        type: String
                        value: v
                  timeout: 10m
              - step:
                  type: ShellScript
                  name: sink
                  identifier: sink
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        # Two distinct-node references (~2 Mongo calls each) + a status ref -> ~5-8 calls
                        # on this single node. Set MAX_EXPRESSION_MONGO_CALLS_<EDITION> low (e.g. 3) to trip.
                        script: echo "<+execution.steps.p1.output.outputVariables.v> <+execution.steps.p2.output.outputVariables.v> <+execution.steps.p1.status>"
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
        tags: {}
