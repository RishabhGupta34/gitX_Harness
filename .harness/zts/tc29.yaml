pipeline:
  name: ZTS TC20 Multi-env fan-out
  identifier: zts_tc29_multi_env
  projectIdentifier: ZTS
  orgIdentifier: default
  description: Multi-environment / service x env (approximated as a matrix fan-out; a real multi-env deploy needs services/envs/infra)
  tags: {}
  stages:
    - stage:
        name: cd
        identifier: cd
        description: ""
        type: Deployment
        spec:
          deploymentType: Kubernetes
          services:
            values:
              - serviceRef: s1
              - serviceRef: s2
            metadata:
              parallel: true
          environments:
            metadata:
              parallel: true
            values:
              - environmentRef: e2
                deployToAll: true
                infrastructureDefinitions: <+input>
              - environmentRef: env1
                deployToAll: false
                infrastructureDefinitions:
                  - identifier: cs
                  - identifier: cds
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: ShellScript_1
                  identifier: ShellScript_1
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: echo 1
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
            rollbackSteps: []
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
    - stage:
        name: caa
        identifier: caa
        description: ""
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: ShellScript_1
                  identifier: ShellScript_1
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: echo 1
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
        tags: {}
