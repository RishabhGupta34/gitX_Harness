pipeline:
  name: ZTS TC08 Stage-level strategy
  identifier: zts_tc08_stage_strategy
  projectIdentifier: ZTS
  orgIdentifier: default
  description: strategy applied at the stage level
  tags: {}
  stages:
    - stage:
        name: st1
        identifier: st1
        type: Custom
        strategy:
          matrix:
            shard:
              - one
              - two
              - three
        spec:
          execution:
            steps:
              - step:
                  name: s1
                  identifier: s1
                  type: ShellScript
                  timeout: 10m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: echo zts
    - stage:
        name: st2
        identifier: st2
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  name: s1
                  identifier: s1
                  type: ShellScript
                  timeout: 10m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: echo zts
