pipeline:
  name: ZTS TC14 Step when stageStatus and JEXL
  identifier: zts_tc22_when_jexl
  projectIdentifier: ZTS
  orgIdentifier: default
  description: "Step when: stageStatus + JEXL condition"
  tags: {}
  stages:
    - stage:
        name: st1
        identifier: st1
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: ShellScript_4
                  identifier: ShellScript_4
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: echo 1
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
                contextType: Pipeline
              - parallel:
                  - step:
                      name: s2
                      identifier: s2
                      type: ShellScript
                      timeout: 10m
                      spec:
                        shell: Bash
                        source:
                          type: Inline
                          spec:
                            script: echo zts
                        executionTarget: {}
                        environmentVariables: []
                        outputVariables: []
                      when:
                        stageStatus: Success
                        condition: 1==2
                  - step:
                      type: ShellScript
                      name: ShellScript_3
                      identifier: ShellScript_3
                      spec:
                        shell: Bash
                        executionTarget: {}
                        source:
                          type: Inline
                          spec:
                            script: echo 1
                        environmentVariables: []
                        outputVariables: []
                      timeout: 10m
              - step:
                  name: s1
                  identifier: s1
                  type: ShellScript
                  timeout: 10m
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: echo zts
                    executionTarget: {}
                    environmentVariables: []
                    outputVariables: []
                  when:
                    stageStatus: All
                    condition: 1==1
        when:
          pipelineStatus: Success
  variables:
    - name: run
      type: String
      value: "yes"
