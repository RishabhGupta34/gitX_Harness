pipeline:
  name: ZTS TC13 Rollback execution ordering
  identifier: zts_tc13_rollback_ordering
  projectIdentifier: ZTS
  orgIdentifier: default
  description: "Rollback execution ordering (last-run rolls back first)"
  tags: {}
  stages:
    - stage:
        name: st1
        identifier: st1
        type: Custom
        spec:
          execution:
            steps:
              - step: {name: f1, identifier: f1, type: ShellScript, timeout: 10m, spec: {shell: Bash, onDelegate: true, source: {type: Inline, spec: {script: echo zts}}}}
              - step: {name: f2, identifier: f2, type: ShellScript, timeout: 10m, spec: {shell: Bash, onDelegate: true, source: {type: Inline, spec: {script: echo zts}}}}
            rollbackSteps:
              - step: {name: rb_f2, identifier: rb_f2, type: ShellScript, timeout: 10m, spec: {shell: Bash, onDelegate: true, source: {type: Inline, spec: {script: echo zts}}}}
              - step: {name: rb_f1, identifier: rb_f1, type: ShellScript, timeout: 10m, spec: {shell: Bash, onDelegate: true, source: {type: Inline, spec: {script: echo zts}}}}
        failureStrategies:
          - onFailure:
              errors: [AllErrors]
              action:
                type: StageRollback
