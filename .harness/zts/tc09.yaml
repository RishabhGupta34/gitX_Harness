pipeline:
  name: ZTS TC09 StepGroup-level strategy
  identifier: zts_tc09_stepgroup_strategy
  projectIdentifier: ZTS
  orgIdentifier: default
  description: strategy applied at the step-group level
  tags: {}
  stages:
    - stage:
        name: st1
        identifier: st1
        type: Custom
        spec:
          execution:
            steps:
              - stepGroup:
                  name: grp
                  identifier: grp
                  strategy:
                    parallelism: 3
                  steps:
                    - step:
                        name: g1
                        identifier: g1
                        type: ShellScript
                        timeout: 10m
                        spec:
                          shell: Bash
                          source:
                            type: Inline
                            spec:
                              script: |-
                                sleep $(( (RANDOM % 6) * 10 ))
                                echo zts
                          executionTarget: {}
                          environmentVariables: []
                          outputVariables: []
                    - step:
                        name: g2
                        identifier: g2
                        type: ShellScript
                        timeout: 10m
                        spec:
                          shell: Bash
                          source:
                            type: Inline
                            spec:
                              script: |-
                                sleep 5
                                echo zts
                          executionTarget: {}
                          environmentVariables: []
                          outputVariables: []
              - step:
                  type: ShellScript
                  name: ShellScript_3
                  identifier: ShellScript_3
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: echo 1
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
