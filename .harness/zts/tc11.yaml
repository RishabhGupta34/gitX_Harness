pipeline:
  name: ZTS TC11 StepGroup rollback
  identifier: zts_tc11_stepgroup_rollback
  projectIdentifier: ZTS
  orgIdentifier: default
  description: "Step-group rollback (StepGroupRollback)"
  tags: {}
  stages:
    - stage:
        name: st1
        identifier: st1
        type: Custom
        spec:
          execution:
            steps:
              - stepGroup:
                  name: grp
                  identifier: grp
                  steps:
                    - step:
                        name: g1
                        identifier: g1
                        type: ShellScript
                        timeout: 10m
                        spec: {shell: Bash, onDelegate: true, source: {type: Inline, spec: {script: echo zts}}}
                        failureStrategies:
                          - onFailure:
                              errors: [AllErrors]
                              action:
                                type: StepGroupRollback
                  rollbackSteps:
                    - step: {name: rb_g1, identifier: rb_g1, type: ShellScript, timeout: 10m, spec: {shell: Bash, onDelegate: true, source: {type: Inline, spec: {script: echo zts}}}}
