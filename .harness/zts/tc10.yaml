pipeline:
  name: ZTS TC10 Stage rollback steps
  identifier: zts_tc10_stage_rollback
  projectIdentifier: ZTS
  orgIdentifier: default
  description: Stage rollback steps (StageRollback failure strategy)
  tags: {}
  stages:
    - stage:
        name: st1
        identifier: st1
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  name: deploy
                  identifier: deploy
                  type: ShellScript
                  timeout: 10m
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: echo zts
                    executionTarget: {}
                    environmentVariables: []
                    outputVariables: []
              - parallel:
                  - step:
                      name: deploy1
                      identifier: deploy1
                      type: ShellScript
                      timeout: 10m
                      spec:
                        shell: Bash
                        source:
                          type: Inline
                          spec:
                            script: |-
                              echo zts
                              exit 1
                        executionTarget: {}
                        environmentVariables: []
                        outputVariables: []
                  - step:
                      name: deploy2
                      identifier: deploy2
                      type: ShellScript
                      timeout: 10m
                      spec:
                        shell: Bash
                        source:
                          type: Inline
                          spec:
                            script: |-
                              echo zts
                              exit 1
                        executionTarget: {}
                        environmentVariables: []
                        outputVariables: []
            rollbackSteps:
              - step:
                  name: rb_deploy
                  identifier: rb_deploy
                  type: ShellScript
                  timeout: 10m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: echo zts
              - step:
                  name: rb_deploy2
                  identifier: rb_deploy2
                  type: ShellScript
                  timeout: 10m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: echo zts
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
