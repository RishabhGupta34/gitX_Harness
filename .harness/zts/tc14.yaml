pipeline:
  name: ZTS TC14 RetryStepGroup
  identifier: zts_tc14_retry_stepgroup
  projectIdentifier: ZTS
  orgIdentifier: default
  description: "RetryStepGroup re-enters a group"
  tags: {}
  stages:
    - stage:
        name: st1
        identifier: st1
        type: Custom
        spec:
          execution:
            steps:
              - stepGroup:
                  name: grp
                  identifier: grp
                  steps:
                    - step:
                        name: g1
                        identifier: g1
                        type: ShellScript
                        timeout: 10m
                        spec: {shell: Bash, onDelegate: true, source: {type: Inline, spec: {script: echo zts}}}
                        failureStrategies:
                          - onFailure:
                              errors: [AllErrors]
                              action:
                                type: RetryStepGroup
                                spec:
                                  retryCount: 2
                                  retryIntervals: [1s]
                                  onRetryFailure:
                                    action:
                                      type: Ignore
