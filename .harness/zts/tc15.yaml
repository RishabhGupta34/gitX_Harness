pipeline:
  name: ZTS TC13 Retry failure strategy
  identifier: zts_tc15_retry
  projectIdentifier: ZTS
  orgIdentifier: default
  description: "Retry: step fails and is retried"
  tags: {}
  stages:
    - stage:
        name: st1
        identifier: st1
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  name: s1
                  identifier: s1
                  type: ShellScript
                  timeout: 10m
                  spec: {shell: Bash, onDelegate: true, source: {type: Inline, spec: {script: echo zts}}}
                  failureStrategies:
                    - onFailure:
                        errors: [AllErrors]
                        action:
                          type: Retry
                          spec:
                            retryCount: 2
                            retryIntervals: [1s]
                            onRetryFailure:
                              action:
                                type: Ignore
