pipeline:
  name: ZTS TC20 ProceedWithDefaultValues
  identifier: zts_tc20_proceed_default
  projectIdentifier: ZTS
  orgIdentifier: default
  description: "ProceedWithDefaultValues failure strategy"
  tags: {}
  stages:
    - stage:
        name: st1
        identifier: st1
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  name: s1
                  identifier: s1
                  type: ShellScript
                  timeout: 10m
                  spec: {shell: Bash, onDelegate: true, source: {type: Inline, spec: {script: echo zts}}}
                  failureStrategies:
                    - onFailure:
                        errors: [AllErrors]
                        action:
                          type: ProceedWithDefaultValues
